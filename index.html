<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Question ❤️</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe6eb, #ffd1dc);
  transition: background 0.6s ease;
}
.card {
  width: 90%;
  max-width: 520px;
  padding: 40px 25px;
  text-align: center;
  background: rgba(255,255,255,0.95);
  border-radius: 28px;
  box-shadow: 0 15px 50px rgba(255,77,109,0.25);
  position: relative;
  z-index: 5;
}
h1 {
  color: #ff4d6d;
  font-size: clamp(30px, 8vw, 42px);
  line-height: 1.15;
  margin: 0 0 15px;
}
.subtitle {
  color: #777;
  font-size: 18px;
  margin-bottom: 30px;
}
button {
  border: none;
  border-radius: 50px;
  padding: 15px 30px;
  margin: 8px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#yesBtn {
  background: #ff4d6d;
  color: white;
  box-shadow: 0 7px 18px rgba(255,77,109,0.3);
  transition: transform .2s;
}
#yesBtn:hover {
  transform: scale(1.08);
}
#noBtn {
  background: #888;
  color: white;
  position: fixed;
  z-index: 20;
  transition: left .12s, top .12s;
}
#message {
  display: none;
  margin-top: 25px;
  color: #ff4d6d;
  font-size: 28px;
  font-weight: bold;
  animation: pop .5s ease;
}
.small {
  font-size: 18px;
  margin-top: 10px;
}
.heart {
  position: fixed;
  bottom: -40px;
  pointer-events: none;
  z-index: 1;
  animation: floatUp linear forwards;
}
.confetti {
  position: fixed;
  top: -20px;
  pointer-events: none;
  z-index: 30;
  animation: fall linear forwards;
}
@keyframes floatUp {
  from {
    transform: translateY(0) rotate(0deg);
    opacity: 1;
  }
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}
@keyframes pop {
  0% {
    transform: scale(.5);
    opacity: 0;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
</style>
</head>
<body>
<div class="card">
  <h1>Can I eat it from the back? ❤️</h1>
  <div class="subtitle">
    I have a very important question for you... 😏
  </div>
  <button id="yesBtn">YES 💘</button>
  <button id="noBtn">NO 🙈</button>
  <div id="message">
    I KNEW you'd say yes! 😍❤️
    <div class="small">
      I knew you couldn't resist me 😂❤️
    </div>
  </div>
</div>
<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const message = document.getElementById("message");
let noCount = 0;
function moveNo() {
  noCount++;
  const padding = 15;
  const maxX = window.innerWidth - noBtn.offsetWidth - padding;
  const maxY = window.innerHeight - noBtn.offsetHeight - padding;
  const x = Math.max(
    padding,
    Math.random() * maxX
  );
  const y = Math.max(
    padding,
    Math.random() * maxY
  );
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  // Make the button increasingly ridiculous
  if (noCount === 3) {
    noBtn.innerText = "NOPE 😂";
  }
  if (noCount === 6) {
    noBtn.innerText = "TRY AGAIN 🙈";
  }
  if (noCount === 10) {
    noBtn.innerText = "YOU CAN'T CATCH ME 😂";
  }
}
// Desktop
noBtn.addEventListener("mouseenter", moveNo);
// Mobile
noBtn.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveNo();
});
// Extra protection
noBtn.addEventListener("click", function(e) {
  e.preventDefault();
  moveNo();
});
// YES
yesBtn.addEventListener("click", function() {
  message.style.display = "block";
  document.body.style.background =
    "linear-gradient(135deg, #ff9fb1, #ff4d6d)";
  yesBtn.style.display = "none";
  noBtn.style.display = "none";
  // Hearts
  for (let i = 0; i < 50; i++) {
    setTimeout(createHeart, i * 40);
  }
  // Confetti
  for (let i = 0; i < 70; i++) {
    setTimeout(createConfetti, i * 25);
  }
  setTimeout(function() {
    alert("I knew you would say yes ❤️");
  }, 500);
});
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  const emojis = [
    "❤️",
    "💕",
    "💗",
    "💖",
    "💘"
  ];
  heart.innerText =
    emojis[Math.floor(Math.random() * emojis.length)];
  heart.style.left =
    Math.random() * 100 + "vw";
  heart.style.fontSize =
    (18 + Math.random() * 25) + "px";
  heart.style.animationDuration =
    (3 + Math.random() * 4) + "s";
  document.body.appendChild(heart);
  setTimeout(function() {
    heart.remove();
  }, 7000);
}
function createConfetti() {
  const piece = document.createElement("div");
  piece.className = "confetti";
  const shapes = ["❤️", "💕", "✨", "💋", "💖"];
  piece.innerText =
    shapes[Math.floor(Math.random() * shapes.length)];
  piece.style.left =
    Math.random() * 100 + "vw";
  piece.style.fontSize =
    (15 + Math.random() * 20) + "px";
  piece.style.animationDuration =
    (2 + Math.random() * 3) + "s";
  document.body.appendChild(piece);
  setTimeout(function() {
    piece.remove();
  }, 5000);
}
// Background hearts
setInterval(createHeart, 1400);
</script>
</body>
</html>
